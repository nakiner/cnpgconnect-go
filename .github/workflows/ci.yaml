name: cnpgconnect-go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/*/go.sum
      - run: make check
      - name: Scan source and built test executables
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          mkdir -p work/vuln-binaries
          go test -c -o work/vuln-binaries/ ./...
          for binary in work/vuln-binaries/*; do
            govulncheck -mode=binary "$binary"
          done
